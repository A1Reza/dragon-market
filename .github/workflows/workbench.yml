name: Workbench verification
on:
  push:
    branches: [main, master, 'feat/visual-research-workbench*', 'feat/human-review-deployment*']
  pull_request:
permissions:
  contents: read
jobs:
  review-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: docker build -f Dockerfile.review -t dragon-market-review:local .
      - run: node scripts/review-smoke.mjs
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-image-evidence
          # Generated local test TLS keys are never uploaded.
          path: |
            artifacts/dragon-review-smoke-*/results.json
            artifacts/dragon-review-smoke-*/*.png
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: node scripts/verify.mjs --fast
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-evidence
          path: artifacts/verification
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -count=1 ./internal/postgres
      - run: go test -race -count=1 ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/mutation-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-evidence
          path: artifacts/mutations
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - name: Verify isolated container cleanup
        if: always()
        run: |
          node scripts/e2e-cleanup.mjs
          test -z "$(docker ps -aq --filter label=dragon-market.disposable=true)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            artifacts/playwright-results.json
            web/test-results
            web/playwright-report
